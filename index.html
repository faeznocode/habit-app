<!doctype html>
<html lang="en" class="h-full bg-[#F2F2F7] dark:bg-[#000000]">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Habits — Daily Routine &amp; Habit Tracker</title>
    <meta
      name="description"
      content="A native iOS-inspired personal daily habit tracker with Cupertino styling, streak tracking, interactive progress rings, and offline PWA capability."
    />
    <meta property="og:title" content="Habits — Daily Routine &amp; Habit Tracker" />
    <meta
      property="og:description"
      content="A native iOS-inspired personal daily habit tracker with Cupertino styling, streak tracking, interactive progress rings, and offline PWA capability."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Apple iOS PWA Capabilities & Status Bar -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Habits" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('habits_settings');
          var theme = saved ? JSON.parse(saved).theme : 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full overflow-hidden select-none antialiased text-[#000000] dark:text-[#FFFFFF] bg-[#F2F2F7] dark:bg-[#000000]">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
